name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build:
    name: Build, test, pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore and build (warnings are errors)
        run: dotnet build DataForge.slnx -c ${{ env.CONFIGURATION }}

      - name: Run unit tests
        run: dotnet test tests/DataForge.UnitTests/DataForge.UnitTests.csproj -c ${{ env.CONFIGURATION }} --no-build

      - name: Run integration tests
        run: dotnet test tests/DataForge.IntegrationTests/DataForge.IntegrationTests.csproj -c ${{ env.CONFIGURATION }} --no-build

      - name: Pack NuGet packages
        run: dotnet pack DataForge.slnx -c ${{ env.CONFIGURATION }} --no-build

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish packages to NuGet
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `nuget` must match the Environment on the nuget.org trusted publishing policy.
    environment: nuget
    permissions:
      id-token: write # enable GitHub OIDC token issuance for this job
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC -> temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          # Recommended: use a secret like ${{ secrets.NUGET_USER }} for your
          # nuget.org username (profile name), NOT your email address
          user: ${{ secrets.NUGET_USER }}

      # Push the package
      - name: NuGet push
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
