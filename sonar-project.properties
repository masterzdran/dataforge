sonar.projectKey=dataforge
sonar.organization=dataforge
sonar.projectName=DataForge
sonar.projectVersion=0.1.0

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclude generated/obj content and test assets from analysis.
sonar.exclusions=**/obj/**,**/bin/**,**/artifacts/**,**/*.g.cs
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/**/*.trx
